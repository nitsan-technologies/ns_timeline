<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="ns-timeline">

    <!-- For Frontend Rendering -->
    <f:render section="content" arguments="{content: content}" />

    <f:section name="content">
        <f:if condition="{content.normalVariation} == 'style-1'">
            <f:render partial="Standard/Style-1.html" arguments="{_all}"/>
        </f:if>
        <f:if condition="{content.normalVariation} == 'style-2'">
            <f:render partial="Standard/Style-2.html" arguments="{_all}"/>
        </f:if>
    </f:section>
</div>
