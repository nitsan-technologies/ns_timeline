name: T3Planet AI Bot

on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  bot:
    # Testing ClickUp: switch both refs to a release tag (e.g. v1.1.0) once it is published.
    uses: nitsan-technologies/t3planet-ai-bot/.github/workflows/bot.yml@task/clickup-integration
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_ASSIGNEES: ${{ secrets.CLICKUP_ASSIGNEES }}
    with:
      bot_ref: task/clickup-integration
      base_branch: main
      clickup_enabled: true
      clickup_team_id: ${{ vars.CLICKUP_TEAM_ID }}
      clickup_list_id: ${{ vars.CLICKUP_LIST_ID }}
      clickup_assignees: ${{ vars.CLICKUP_ASSIGNEES }}
